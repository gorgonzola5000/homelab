apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bootstrap
spec:
  refreshPolicy: CreatedOnce
  target:
    template:
      engineVersion: v2
      data:
        username: bootstrap
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bootstrap
