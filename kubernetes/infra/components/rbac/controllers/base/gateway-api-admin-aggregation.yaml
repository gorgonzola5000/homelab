apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aggregate-gateway-api-to-admin
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups:
      - "gateway.networking.k8s.io"
    resources:
      - "httproutes"
      - "grpcroutes"
      - "tcproutes"
      - "tlsroutes"
      - "udproutes"
      - "referencegrants"
    verbs:
      - "*"
  - apiGroups:
      - "gateway.networking.k8s.io"
    resources:
      - "gateways"
      - "gatewayclasses"
    verbs:
      - "get"
      - "list"
      - "watch"
