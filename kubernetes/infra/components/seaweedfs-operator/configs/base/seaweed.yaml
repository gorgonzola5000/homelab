apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
spec:
  master:
    replicas: 1
  #    persistence:
  #      enabled: true
  #      resources:
  #        requests:
  #          storage: "1Gi"
  volume:
    replicas: 1
    requests:
      storage: 100Gi
  filer:
    replicas: 1
    persistence:
      enabled: true
      resources:
        requests:
          storage: "1Gi"
  s3:
    replicas: 1
