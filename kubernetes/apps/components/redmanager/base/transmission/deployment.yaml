apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  labels:
    app: transmission
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      #dnsPolicy: Default
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: gluetun-sidecar
          image: ghcr.io/qdm12/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
          restartPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: redmanager-secret
                  key: WIREGUARD_PRIVATE_KEY
            - name: TRANSMISSION__RPC_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: transmission
                  key: TRANSMISSION_USER
            - name: TRANSMISSION__RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redmanager-generated-secret
                  key: TRANSMISSION_PASS
            - name: FIREWALL_INPUT_PORTS
              value: "9091"
            - name: SERVER_COUNTRIES
              value: Netherlands
            - name: PORT_FORWARD_ONLY
              value: on
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_PORT_FORWARDING
              value: on
            - name: VPN_TYPE
              value: wireguard
            - name: LOG_LEVEL
              value: info
            - name: BLOCK_MALICIOUS
              value: off
            - name: BLOCK_SURVEILLANCE
              value: off
            - name: BLOCK_ADS
              value: off
            - name: HEALTH_RESTART_VPN
              value: on
            - name: DNS_UPSTREAM_IPV6
              value: on
            - name: DNS_SERVER
              value: off
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: "/usr/local/bin/transmission-port-update.sh --user $TRANSMISSION__RPC_USERNAME --pass $TRANSMISSION__RPC_PASSWORD --port {{PORTS}}"
          volumeMounts:
            - name: transmission
              mountPath: /usr/local/bin/transmission-port-update.sh
              subPath: transmission-port-update.sh
            - name: transmission
              mountPath: /usr/local/bin/healthcheck.sh
              subPath: healthcheck.sh
          ports:
            - containerPort: 9091
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck.sh
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck.sh
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

      containers:
        - name: transmission
          image: ghcr.io/home-operations/transmission:4.1.3@sha256:172ff08b53d10b8c83bc7e4d6c74e69d2276509c1997c173c001bbf8b2d0512a
          env:
            - name: TRANSMISSION__RPC_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: transmission
                  key: TRANSMISSION_USER
            - name: TRANSMISSION__RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redmanager-generated-secret
                  key: TRANSMISSION_PASS
          volumeMounts:
            - name: download
              mountPath: /downloads
            - name: transmission-config
              mountPath: /config
            - name: redmanager-transmission-shared
              mountPath: /redmanager-transmission-shared

      volumes:
        - name: download
          persistentVolumeClaim:
            claimName: download
        - name: transmission-config
          persistentVolumeClaim:
            claimName: transmission-config
        - name: transmission
          configMap:
            name: transmission
            defaultMode: 0744
        - name: redmanager-transmission-shared
          persistentVolumeClaim:
            claimName: redmanager-transmission-shared
