apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - secret.enc.yaml

patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: redmanager-db
    patch: |-
      - op: replace
        path: /spec/bootstrap
        value:
          recovery:
            database: redmanager
            owner: redmanager
            volumeSnapshots:
              storage:
                name: redmanager-db-snapshot
                kind: VolumeSnapshot
                apiGroup: snapshot.storage.k8s.io
