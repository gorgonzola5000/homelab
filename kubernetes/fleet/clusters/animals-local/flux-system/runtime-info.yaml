apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-runtime-info
  namespace: flux-system
  labels:
    toolkit.fluxcd.io/runtime: "true"
    reconcile.fluxcd.io/watch: Enabled
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: "Merge"
data:
  ARTIFACT_TAG: latest
  ENVIRONMENT: animals-local
  CLUSTER_NAME: animals-local
  CLUSTER_DOMAIN: cluster.local
  ARTIFACT_SUBJECT_GIT_REF: refs/heads/main
  ROUTE_SUFFIX: "-animals-local"
  HOMELAB_DOMAIN: "parents-basement.win"
  HOMELAB_INTERNAL_SUBDOMAIN: "home.parents-basement.win"
