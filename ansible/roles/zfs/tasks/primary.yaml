---
- name: Enable and start ZFS PVC tagging timer
  ansible.builtin.systemd:
    name: tag-zfs-pvcs.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Create restricted zfsbackup user
  ansible.builtin.user:
    name: zfsbackup
    system: true
    shell: /bin/bash
    create_home: true

- name: Delegate ZFS permissions to zfsbackup user
  ansible.builtin.command: >
    zfs allow -u zfsbackup send,hold,release,bookmark,snapshot {{ zfs_active_dataset }}
  changed_when: false

- name: Delegate ZFS receive permissions to zfsbackup user for failback
  ansible.builtin.command: >
    zfs allow -u zfsbackup create,receive,mount {{ zfs_passive_dataset }}
  changed_when: false
