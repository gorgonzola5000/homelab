---
# ==========================================
# PHASE 1: Freeze Secondary and Reverse Sync
# ==========================================
- name: Secondary Node Operations (Freeze & Push)
  when: zfs_host_type == 'secondary'
  block:
    - name: Freeze Kubernetes on the Secondary node
      ansible.builtin.systemd:
        name: rke2-server.service
        state: stopped

    - name: Ensure Syncoid timer is stopped on the Secondary node
      ansible.builtin.systemd:
        name: syncoid-pull.timer
        state: stopped

    - name: Push final delta sync from Secondary back to Primary
      ansible.builtin.command: >
        syncoid --no-sync-snap 
        {{ zfs_active_dataset }} 
        zfsbackup@{{ zfs_primary_host_fqdn }}:{{ zfs_passive_dataset }}
      register: final_sync
      changed_when: "'sent' in final_sync.stdout"

# ==========================================
# PHASE 2 & 3: Start and Promote Primary
# ==========================================
- name: Primary Node Operations (Start & Promote)
  when: zfs_host_type == 'primary'
  block:
    - name: Enable and start RKE2 server on Primary
      ansible.builtin.systemd:
        name: rke2-server.service
        state: started
        enabled: true

    - name: Wait for Kubernetes API to be ready on Primary
      ansible.builtin.command: "{{ rke2_kubectl_path }} --kubeconfig {{ rke2_kubeconfig_path }} get nodes"
      register: k8s_api
      until: k8s_api.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Execute Python DR State Orchestrator (Failback)
      ansible.builtin.command: /usr/local/bin/dr_promote.py
      environment:
        ZFS_PASSIVE_DATASET: "{{ zfs_passive_dataset }}"
        ZFS_ACTIVE_DATASET: "{{ zfs_active_dataset }}"
        ZFS_PASSIVE_OPENEBS_DATASET: "{{ zfs_passive_openebs_dataset }}"
        ZFS_ACTIVE_OPENEBS_DATASET: "{{ zfs_active_openebs_dataset }}"
        RKE2_KUBECONFIG_PATH: "{{ rke2_kubeconfig_path }}"
      register: failback_script
      changed_when: true

# ==========================================
# PHASE 4: Demote Secondary and Resume Sync
# ==========================================
- name: Secondary Node Operations (Demote & Resume)
  when: zfs_host_type == 'secondary'
  block:
    - name: Demote active dataset to passive on Secondary node
      ansible.builtin.command: zfs rename {{ zfs_active_dataset }} {{ zfs_passive_dataset }}
      register: zfs_demote
      changed_when: true

    - name: Enable and start Syncoid Timer on Secondary node
      ansible.builtin.systemd:
        name: syncoid-pull.timer
        enabled: true
        state: started
