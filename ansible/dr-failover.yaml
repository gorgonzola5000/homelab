---
- name: Disaster Recovery - Failover
  hosts: k8s_clusters
  become: true
  any_errors_fatal: true

  vars_prompt:
    - name: confirm_failover
      prompt: "Are you sure you want to start failover? Type 'YES' to confirm"
      default: "NO"
      private: false

  pre_tasks:
    - name: Abort if not explicitly confirmed
      ansible.builtin.fail:
        msg: "Failover aborted"
      when: confirm_failover != "YES"

  tasks:
    - name: Execute ZFS Failover Sequence
      ansible.builtin.include_role:
        name: zfs
        tasks_from: failover.yaml

    - name: Display Failover Log
      ansible.builtin.debug:
        var: failover_script.stdout_lines
