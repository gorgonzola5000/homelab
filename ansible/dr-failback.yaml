---
- name: ZFS Disaster Recovery - Failback
  hosts: k8s_clusters
  become: true
  gather_facts: false

  vars_prompt:
    - name: confirm_failback
      prompt: "CRITICAL: Are you sure you want to start FAILBACK? Type 'YES' to confirm"
      default: "NO"
      private: false

  pre_tasks:
    - name: Abort if not explicitly confirmed
      ansible.builtin.fail:
        msg: "Failback aborted by user."
      when: confirm_failback != "YES"

  tasks:
    - name: Execute ZFS Failback Sequence
      ansible.builtin.include_role:
        name: zfs
        tasks_from: failback.yaml

    - name: Display Failback Log
      ansible.builtin.debug:
        var: failback_script.stdout_lines
