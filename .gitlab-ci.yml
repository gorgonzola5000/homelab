stages:
  - publish
  - reconcile

publish-fleet:
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - kubernetes/fleet/**/*
  trigger:
    forward:
      pipeline_variables: true
    include:
      - component: $CI_SERVER_FQDN/starfruit6000/fluxcd/oci-artifact@0.5.0
        inputs:
          version: "0.5.0"
          registry_image_url: "oci://$CI_REGISTRY_IMAGE/fleet"
          image_tag: "latest"
          manifest_path: "./kubernetes/fleet"
          flux_oci_repo_name: "fleet"
          flux_oci_namespace_name: "flux-system"
          job_image_name: "$CI_TEMPLATE_REGISTRY_HOST/starfruit6000/fluxcd/fluxcd"
          skip_reconcile: true

