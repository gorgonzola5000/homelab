stages:
  - build
  - trigger

jsonnet-build:
  stage: build
  image: alpine:latest
  script:
    - apk add -U jsonnet
    - jsonnet gitlab-ci.jsonnet > generated-config.yml
    - cat generated-config.yml
  artifacts:
    paths:
      - generated-config.yml

child-pipeline:
  stage: trigger
  needs:
    - jsonnet-build
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/flux-d2-architecture"'
  trigger:
    include:
      - artifact: generated-config.yml
        job: jsonnet-build
    forward:
      pipeline_variables: true
    strategy: depend
