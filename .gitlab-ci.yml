          skip_reconcile: true

reconcile-arr:
  stage: reconcile
  needs: ["publish-arr"]
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - kubernetes/apps/components/arr/**/*
  parallel:
    matrix:
      - CLUSTER: ["meddle", "animals", "meddle-local", "animals-local"]
  trigger:
    forward:
      pipeline_variables: true
    include:
      - component: $CI_SERVER_FQDN/starfruit6000/fluxcd/reconcile@0.5.0
        inputs:
          version: "0.5.0"
          flux_source_type: "oci"
          flux_source_name: "apps"
          flux_source_namespace: "arr"
          kubernetes_agent_reference: "$CI_PROJECT_PATH:$CLUSTER"
          job_image_name: "$CI_TEMPLATE_REGISTRY_HOST/starfruit6000/fluxcd/fluxcd"

